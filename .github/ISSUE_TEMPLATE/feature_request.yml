name: Feature idea
description: Propose a world, creature, interaction, or workflow improvement
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Explain what a visitor or sandbox operator could do.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where does it fit?
      description: Name the world, demo, controller, projector, or documentation area.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References and asset provenance
      description: Link examples and note any licenses or attribution needed.
